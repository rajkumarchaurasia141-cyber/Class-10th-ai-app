<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" className="w-full h-full">
  <defs>
    <!-- Gradients -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FEF9C3" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="redRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#EAB308" flood-opacity="0.25" />
    </filter>
    <filter id="shadowCap" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Golden Glow behind cap -->
  <circle cx="160" cy="115" r="95" fill="url(#goldGrad)" opacity="0.18" filter="url(#softGlow)" />
  <ellipse cx="160" cy="195" rx="100" ry="16" fill="#000000" opacity="0.08" />

  <!-- Graduation Cap (Mortarboard Base / Skull Cap) -->
  <path d="M105 108 C105 135 215 135 215 108 L215 125 C215 152 105 152 105 125 Z" fill="#090D16" />
  <path d="M110 116 C110 138 210 138 210 116 L210 128 C210 148 110 148 110 128 Z" fill="#1E293B" opacity="0.8" />

  <!-- Mortarboard Diamond Top -->
  <g filter="url(#shadowCap)">
    <polygon points="160,52 265,95 160,138 55,95" fill="url(#capGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Subtle top face highlight border -->
    <polyline points="58,95 160,54 262,95" stroke="#64748B" stroke-width="1" fill="none" opacity="0.6" />
  </g>

  <!-- Cap Button Center -->
  <circle cx="160" cy="95" r="7.5" fill="url(#goldGrad)" stroke="#A16207" stroke-width="1" />
  <circle cx="160" cy="94" r="3" fill="#FEF08A" />

  <!-- Golden Tassel String -->
  <path d="M160 95 C185 100 208 122 215 142" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
  <!-- Tassel Ring -->
  <circle cx="215" cy="144" r="4.5" fill="url(#goldGrad)" />
  <!-- Tassel Hanging Fringe -->
  <path d="M213 148 L209 184 C209 187 221 187 221 184 L217 148 Z" fill="url(#goldGrad)" />
  <!-- Tassel strands details -->
  <line x1="212" y1="156" x2="212" y2="183" stroke="#A16207" stroke-width="0.8" opacity="0.7" />
  <line x1="215" y1="156" x2="215" y2="184" stroke="#FEF08A" stroke-width="0.8" />
  <line x1="218" y1="156" x2="218" y2="183" stroke="#A16207" stroke-width="0.8" opacity="0.7" />

  <!-- Rolled Diploma / Certificate Scroll -->
  <g transform="translate(68, 142) rotate(-8)">
    <!-- Scroll Drop Shadow -->
    <rect x="0" y="8" width="130" height="24" rx="12" fill="#000000" opacity="0.12" />
    
    <!-- Main Scroll Body -->
    <rect x="0" y="4" width="130" height="26" rx="13" fill="url(#scrollGrad)" stroke="#CA8A04" stroke-width="1.2" />
    
    <!-- Rolled End Curl (Left) -->
    <ellipse cx="14" cy="17" rx="9" ry="12" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.2" />
    <ellipse cx="14" cy="17" rx="5" ry="8" fill="#FDE047" stroke="#A16207" stroke-width="0.8" />
    <circle cx="14" cy="17" r="2" fill="#854D0E" />

    <!-- Red Ribbon Band wrapped around diploma -->
    <rect x="62" y="3.5" width="16" height="27" rx="2" fill="url(#redRibbon)" stroke="#991B1B" stroke-width="0.8" />
    <!-- Ribbon Bow / Hanging Ties -->
    <path d="M70 28 C64 36 58 44 54 48 C58 43 66 38 70 31" fill="url(#redRibbon)" />
    <path d="M72 28 C78 36 84 44 88 47 C84 42 76 37 72 31" fill="url(#redRibbon)" />
    <circle cx="70" cy="27" r="3.5" fill="#EF4444" stroke="#991B1B" stroke-width="0.5" />
  </g>

  <!-- Subtle Sparkles -->
  <path d="M75 62 L78 70 L86 73 L78 76 L75 84 L72 76 L64 73 L72 70 Z" fill="#FACC15" opacity="0.7" />
  <path d="M245 68 L247 73 L252 75 L247 77 L245 82 L243 77 L238 75 L243 73 Z" fill="#FACC15" opacity="0.7" />
</svg>
