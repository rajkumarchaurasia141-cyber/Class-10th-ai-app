<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Background with rounded rectangle for Android squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Inner border -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85" />
  
  <!-- Central Badge -->
  <circle cx="256" cy="200" r="110" fill="#ffffff" opacity="0.12" />
  
  <!-- Graduation Cap / Book Icon -->
  <path d="M256 120 L370 180 L256 240 L142 180 Z" fill="url(#goldGrad)" />
  <path d="M340 210 L340 270 Q340 310 256 310 Q172 310 172 270 L172 210 L256 255 Z" fill="#ffffff" opacity="0.9" />
  <path d="M370 185 L370 260" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  <circle cx="370" cy="268" r="8" fill="#f59e0b" />

  <!-- 10th Badge Text -->
  <text x="256" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#b91c1c">10th</text>

  <!-- Brand Hindi Typography -->
  <text x="256" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="1">पढ़ेगा बिहार</text>
  <text x="256" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="url(#goldGrad)" letter-spacing="3">टॉपर बैच फुल सिलेबस</text>
</svg>
