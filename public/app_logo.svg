<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Badge (PW Style) -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)" />
  
  <!-- Inner Glow Ring -->
  <rect x="50" y="50" width="412" height="412" rx="90" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4" />

  <!-- Energy Spark / Bolt Accent -->
  <path d="M280 60 L240 180 L310 180 L260 300" fill="none" stroke="#facc15" stroke-opacity="0.25" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Main Lettermark BG -->
  <g filter="url(#shadow)">
    <!-- B Letter -->
    <path d="M 150 160 H 220 C 255 160 275 178 275 205 C 275 225 260 240 240 246 C 265 252 280 270 280 296 C 280 326 255 350 215 350 H 150 Z M 195 200 V 222 H 218 C 230 222 238 217 238 211 C 238 205 230 200 218 200 Z M 195 260 V 310 H 222 C 236 310 244 302 244 285 C 244 268 236 260 222 260 Z" fill="url(#goldGrad)" />
    
    <!-- G Letter -->
    <path d="M 360 160 H 295 V 350 H 360 V 265 H 330 V 310 H 325 V 200 H 360 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Bottom Brand Text Inside Logo -->
  <rect x="110" y="380" width="292" height="64" rx="32" fill="url(#accentGrad)" filter="url(#shadow)" />
  <text x="256" y="422" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">BSEB GURU</text>
</svg>
